<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root { --text: #1c1c1e; --muted: #6e6e73; --bg: #f2f2f7; --card: #ffffff; --accent: #0f7489; --line: #e5e5ea; }
    @media (prefers-color-scheme: dark) { :root { --text: #f2f2f7; --muted: #98989d; --bg: #0b1324; --card: #16213a; --accent: #4cc3d9; --line: #263354; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding-top: 24px; padding-bottom: 8px; }
    header a.brand { font-weight: 700; font-size: 22px; color: var(--text); text-decoration: none; }
    nav a { margin-left: 18px; color: var(--muted); text-decoration: none; }
    nav a:hover, nav a.on { color: var(--accent); }
    main { background: var(--card); border-radius: 18px; padding: 28px 28px 20px; margin-top: 12px; margin-bottom: 24px; }
    h1 { font-size: 30px; line-height: 1.2; margin: 0 0 12px; }
    h2 { font-size: 21px; margin: 28px 0 8px; }
    a { color: var(--accent); }
    p.lede { font-size: 19px; color: var(--muted); margin-top: 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
    footer { color: var(--muted); font-size: 14px; padding-bottom: 32px; }
    @media (max-width: 520px) { main { padding: 22px 18px 14px; border-radius: 14px; } nav a { margin-left: 12px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">Tilt</a>
    <nav>
      <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} class="on"{% endif %}>Support</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} class="on"{% endif %}>Privacy</a>
    </nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer>Tilt · <a href="{{ site.issues }}">Questions and problems</a></footer>
</body>
</html>
